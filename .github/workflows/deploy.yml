name: Build and Deploy Setorf-UI

on:
  push:
    branches: [production]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/setorf-ui:latest
            ${{ secrets.DOCKER_USERNAME }}/setorf-ui:${{ github.sha }}

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml,nginx-proxy-config/setorf.conf"
          target: "/opt/setorf-ui"

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Ensure docker network exists
            docker network create nginx-proxy-network 2>/dev/null || true

            # Copy nginx proxy config
            cp /opt/setorf-ui/nginx-proxy-config/setorf.conf /opt/nginx-proxy/conf.d/setorf.conf 2>/dev/null || true

            # Deploy container
            cd /opt/setorf-ui
            export DOCKER_IMAGE=${{ secrets.DOCKER_USERNAME }}/setorf-ui:latest
            docker compose down 2>/dev/null || true
            docker compose pull
            docker compose up -d

            # Reload nginx-proxy if running
            docker exec nginx-proxy nginx -s reload 2>/dev/null || true

            # Cleanup
            docker image prune -f
