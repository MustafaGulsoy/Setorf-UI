name: Build and Deploy Setorf-UI

on:
  push:
    branches: [production]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/setorf-ui:latest
            ${{ secrets.DOCKER_USERNAME }}/setorf-ui:${{ github.sha }}

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml,nginx-proxy-config/setorf.conf"
          target: "/opt/setorf-ui"

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Ensure docker network exists
            docker network create nginx-proxy-network 2>/dev/null || true

            # Deploy container
            cd /opt/setorf-ui
            export DOCKER_IMAGE=${{ secrets.DOCKER_USERNAME }}/setorf-ui:latest
            docker compose down 2>/dev/null || true
            docker compose pull
            docker compose up -d

            # Connect container to nginx-proxy network
            docker network connect nginx-proxy-network setorf-ui-app 2>/dev/null || true
            docker network connect nginx-proxy-network nginx-proxy 2>/dev/null || true

            # Find nginx-proxy conf.d path and copy config
            NGINX_CONF_DIR=$(docker inspect nginx-proxy --format='{{ range .Mounts }}{{ if eq .Destination "/etc/nginx/conf.d" }}{{ .Source }}{{ end }}{{ end }}' 2>/dev/null)
            if [ -n "$NGINX_CONF_DIR" ]; then
              cp /opt/setorf-ui/nginx-proxy-config/setorf.conf "$NGINX_CONF_DIR/setorf.conf"
            fi

            # Reload nginx-proxy
            docker exec nginx-proxy nginx -t && docker exec nginx-proxy nginx -s reload

            # Cleanup
            docker image prune -f
