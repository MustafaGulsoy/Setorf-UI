<section id="hero" class="relative h-screen flex items-center justify-center overflow-hidden">
  <!-- Background Image with Parallax -->
  <div
    class="absolute inset-0 bg-cover bg-center"
    [style.transform]="'translateY(' + parallaxOffset + 'px)'"
    style="background-image: url('https://images.unsplash.com/photo-1416879595882-3373a0480b5b?w=1920&q=80');"
  >
  </div>

  <!-- Dark Overlay -->
  <div class="absolute inset-0 bg-gradient-to-b from-black/60 via-black/40 to-black/70"></div>

  <!-- Content -->
  <div class="relative z-10 text-center px-4 max-w-4xl mx-auto">
    <h1 class="text-4xl md:text-6xl lg:text-7xl font-bold text-white mb-6 leading-tight">
      Kaliteli Torf<br>
      <span class="text-amber-300">Toprak Cozumleri</span>
    </h1>
    <p class="text-lg md:text-xl text-gray-200 mb-10 max-w-2xl mx-auto leading-relaxed">
      Profesyonel torf toprak urunleri ile bahcenize, seraniza ve projelerinize
      en iyi baslangici yapin.
    </p>
    <div class="flex flex-col sm:flex-row gap-4 justify-center">
      <a
        href="#urunler"
        class="bg-amber-800 hover:bg-amber-900 text-white font-semibold px-8 py-4 rounded-full text-lg transition-all duration-300 hover:scale-105 hover:shadow-xl"
      >
        Urunlerimizi Kesfet
      </a>
      <a
        href="https://wa.me/905330944571"
        target="_blank"
        rel="noopener"
        class="border-2 border-white text-white hover:bg-white hover:text-amber-900 font-semibold px-8 py-4 rounded-full text-lg transition-all duration-300"
      >
        Hemen Siparis Ver
      </a>
    </div>
  </div>

  <!-- Scroll Indicator -->
  <div class="absolute bottom-8 left-1/2 -translate-x-1/2 animate-bounce">
    <svg class="w-6 h-10 text-white/70" fill="none" stroke="currentColor" viewBox="0 0 24 40">
      <rect x="1" y="1" width="22" height="38" rx="11" stroke-width="2"/>
      <circle cx="12" cy="12" r="3" fill="currentColor">
        <animate attributeName="cy" values="12;24;12" dur="2s" repeatCount="indefinite"/>
      </circle>
    </svg>
  </div>
</section>
