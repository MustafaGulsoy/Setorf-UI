<section id="neden-biz" class="py-20 md:py-28 bg-white">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <!-- Section Header -->
    <div class="text-center mb-16" appScrollAnimate="fade-up">
      <span class="text-amber-700 font-semibold text-sm uppercase tracking-widest mb-4 block">Neden Biz?</span>
      <h2 class="text-3xl md:text-4xl lg:text-5xl font-bold text-gray-900 mb-4">
        Bizi <span class="text-amber-800">Tercih Edin</span>
      </h2>
      <p class="text-gray-600 text-lg max-w-2xl mx-auto">
        Kalite, çeşitlilik ve güven bir arada.
      </p>
    </div>

    <!-- Feature Cards -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
      @for (feature of features; track feature.title; let i = $index) {
        <div
          appScrollAnimate="scale-up"
          [animationDelay]="i * 150"
          class="text-center p-8 rounded-2xl bg-gradient-to-br from-amber-50 to-white border border-amber-100 hover:shadow-xl transition-all duration-500 hover:-translate-y-2"
        >
          <div
            class="w-16 h-16 mx-auto mb-6 rounded-full bg-amber-100 text-amber-800 flex items-center justify-center"
            [innerHTML]="feature.icon"
          ></div>
          <h3 class="text-xl font-bold text-gray-900 mb-3">{{ feature.title }}</h3>
          <p class="text-gray-600 leading-relaxed">{{ feature.description }}</p>
        </div>
      }
    </div>
  </div>
</section>
