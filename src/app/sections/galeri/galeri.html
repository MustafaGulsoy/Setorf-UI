<section id="galeri" class="py-20 md:py-28 bg-stone-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <!-- Section Header -->
    <div class="text-center mb-16" appScrollAnimate="fade-up">
      <span class="text-amber-700 font-semibold text-sm uppercase tracking-widest mb-4 block">Galeri</span>
      <h2 class="text-3xl md:text-4xl lg:text-5xl font-bold text-gray-900 mb-4">
        Toprak <span class="text-amber-800">Dünyamız</span>
      </h2>
      <p class="text-gray-600 text-lg max-w-2xl mx-auto">
        Ürünlerimizden ve uygulamalarımızdan kareler.
      </p>
    </div>

    <!-- Image Grid -->
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
      @for (image of images; track image.src; let i = $index) {
        <div
          appScrollAnimate="zoom-in"
          [animationDelay]="i * 100"
          class="relative overflow-hidden rounded-xl group aspect-square"
        >
          <img
            [src]="image.src"
            [alt]="image.alt"
            class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700"
            loading="lazy"
          />
          <div class="absolute inset-0 bg-black/0 group-hover:bg-black/30 transition-all duration-500 flex items-end">
            <span class="text-white text-sm font-medium p-3 opacity-0 group-hover:opacity-100 transition-opacity duration-500 translate-y-4 group-hover:translate-y-0">
              {{ image.alt }}
            </span>
          </div>
        </div>
      }
    </div>
  </div>
</section>
